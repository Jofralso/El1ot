name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop build if there are Python syntax errors or undefined names
          flake8 core/ agents/ knowledge/ tools/ security/ hardware/ voice/ vision/ avatar/ ui/ tests/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 core/ agents/ knowledge/ tools/ security/ hardware/ voice/ vision/ avatar/ ui/ tests/ \
            --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Type check with mypy (optional)
        run: |
          pip install mypy
          mypy core/ agents/ knowledge/ tools/ voice/ vision/ avatar/ --ignore-missing-imports || true

      - name: Run tests
        run: |
          pytest tests/ -v --cov=core --cov=agents --cov=knowledge --cov=tools --cov=security --cov=voice --cov=vision --cov=avatar --cov-report=xml
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker compose build --no-cache

      - name: Run services
        run: |
          docker compose up -d

      - name: Wait for services to be ready
        run: |
          sleep 10
          docker compose ps

      - name: Health check
        run: |
          docker compose exec -T core curl -f http://localhost:8000/health || exit 1

      - name: API smoke test
        run: |
          docker compose exec -T core python -c "
          import urllib.request, json
          r = urllib.request.urlopen('http://localhost:8000/health')
          d = json.loads(r.read())
          assert d['status'] in ('healthy', 'degraded'), f'Unexpected status: {d[\"status\"]}'
          r2 = urllib.request.urlopen('http://localhost:8000/system/ready')
          d2 = json.loads(r2.read())
          assert d2['status'] == 'ready'
          r3 = urllib.request.urlopen('http://localhost:8000/metrics')
          assert b'eliot_app_info' in r3.read() or b'eliot_requests_total' in r3.read()
          print('All smoke tests passed')
          "

      - name: Cleanup
        run: |
          docker compose down

  security:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
